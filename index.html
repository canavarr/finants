<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finantsarvestuse Proovieksam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="card intro-card fade-in">
            <h1>Finantsarvestus</h1>
            <p style="color: var(--text-muted); margin-bottom: 32px; font-size: 1.1rem;">Proovieksam • 20 Küsimust • 90
                Minutit</p>

            <div id="dashboardPreview" class="hidden">
                <div
                    style="margin: 24px 0; padding: 20px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">
                    <h3 style="margin-bottom: 8px;">Sinu Progress</h3>
                    <p>Lahendatud eksameid: <strong id="totalExams">0</strong></p>
                    <p>Keskmine tulemus: <strong id="avgScore">0%</strong></p>
                </div>
            </div>

            <button onclick="app.startExam()" class="btn btn-primary">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Alusta Eksamit
            </button>
        </div>

        <!-- Exam Screen -->
        <div id="examScreen" class="hidden">
            <div class="exam-top-bar">
                <div class="timer" id="timer">90:00</div>
                <div>Küsimus <span id="currentQ">1</span> / 20</div>
            </div>

            <div id="questionContainer">
                <!-- Question content injected here -->
            </div>

            <div class="navigation" style="text-align: right;">
                <button onclick="app.submitAnswer()" class="btn btn-primary">
                    Järgmine Küsimus
                </button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="hidden fade-in">
            <div class="card score-card">
                <h2>Eksami Tulemus</h2>
                <div class="score-display">
                    <span id="percentage">0</span>%
                </div>
                <p style="font-size: 1.25rem; opacity: 0.9;"><span id="finalScore">0</span> / 50 punkti</p>
            </div>

            <h3 style="margin-top: 40px;">Tulemused Peatükkide Kaupa</h3>
            <div class="stats-grid" id="chapterStats">
                <!-- Stats injected here -->
            </div>

            <div class="btn-group">
                <button onclick="app.showReview()" class="btn btn-secondary">Vaata vastused üle</button>
                <button onclick="location.reload()" class="btn btn-primary">Uus Eksam</button>
            </div>

            <div id="reviewContainer" class="hidden" style="margin-top: 40px;">
                <!-- Review content injected here -->
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>

</html>
