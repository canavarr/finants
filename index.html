<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finantsarvestuse Proovieksam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Start Screen -->
        <!-- Start Screen -->
        <div id="startScreen" class="fade-in" style="text-align: center; padding: 40px 0;">
            <h1 style="color: var(--accent); margin-bottom: 10px;">Finantsarvestuse Eksam</h1>
            <p style="color: var(--text-muted); margin-bottom: 40px;">Testi oma teadmisi 20 küsimusega (90 minutit)</p>

            <div id="dashboardPreview" class="hidden"
                style="margin-bottom: 30px; padding: 20px; background: rgba(255,255,255,0.7); border-radius: 12px; display: inline-block; min-width: 300px;">
                <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">Sinu statistika</div>
                <div style="display: flex; justify-content: space-around;">
                    <div>
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent);" id="totalExams">0</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Tehtud eksamit</div>
                    </div>
                    <div>
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent);" id="avgScore">0%</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Keskmine</div>
                    </div>
                    <div>
                        <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent);" id="avgTime">-</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">Ajavõtt</div>
                    </div>
                </div>
                <button id="resetBtn" class="btn btn-reset">Nulli ajalugu</button>
            </div>

            <div>
                <button id="resumeBtn" class="btn btn-secondary hidden"
                    style="padding: 12px 32px; font-size: 1.1rem; margin-right: 10px; margin-bottom: 10px;">
                    Jätka pooleli olevat eksamit
                </button>
                <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
                    <button onclick="app.startExam()" class="btn btn-primary"
                        style="padding: 12px 32px; font-size: 1.1rem;">
                        Alusta Eksamit
                    </button>
                    <button onclick="app.startWeaknessExam()" class="btn btn-secondary"
                        style="padding: 10px 24px; font-size: 1rem; border:1px solid var(--accent); color: var(--accent); background:white;">
                        Treeni nõrku kohti
                    </button>
                </div>
            </div>
        </div>

        <!-- Exam Screen -->
        <div id="examScreen" class="hidden">
            <div class="exam-top-bar">
                <div class="timer" id="timer">90:00</div>
                <div>Küsimus <span id="currentQ">1</span> / 20</div>
            </div>

            <div id="questionContainer">
                <!-- Question content injected here -->
            </div>

            <div class="navigation"
                style="text-align: right; display: flex; justify-content: space-between; margin-top: 20px;">
                <button onclick="if(confirm('Oled kindel, et soovid eksami lõpetada?')) app.endExam(true)"
                    class="btn btn-secondary" style="background: #e2e8f0; color: #1e293b; border: none;">
                    Lõpeta eksam
                </button>
                <button onclick="app.submitAnswer()" class="btn btn-primary">
                    Järgmine Küsimus
                </button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="hidden">
            <h2 style="text-align: center; margin-bottom: 30px;">Eksami Tulemused</h2>

            <div class="card result-header-card" style="text-align: center; padding: 40px; margin-bottom: 30px;">
                <div style="font-size: 1.1rem; color: var(--text-muted);">Sinu punktiskoor</div>
                <div style="font-size: 3rem; font-weight: 800; color: var(--accent); margin: 10px 0;">
                    <span id="finalScore">0</span> / 50
                </div>
                <!-- Grade Display -->
                <div id="gradeContainer" style="margin: 20px 0;">
                    <span style="font-size: 1.2rem; color: var(--text-muted);">Hinne:</span>
                    <span id="finalGrade" class="grade-badge">-</span>
                </div>
                <div style="font-size: 1.2rem; color: var(--text-muted);">
                    Tulemus: <span id="percentage">0</span>% | Aeg: <span id="finalTime">0m 0s</span>
                </div>
            </div>

            <!-- Detailed Review List injected here -->
            <div id="detailedReviewList" style="margin-bottom: 40px;"></div>

            <div style="text-align: center;">
                <button onclick="location.reload()" class="btn btn-primary">Alusta Uuesti</button>
            </div>
        </div>
    </div>





    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, initializeFirestore, collection, addDoc, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js";



        // --- PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAY2sNwCIJFSlqU6RYo5FhqvvhY2N_aXic",
            authDomain: "finants-b0ec2.firebaseapp.com",
            projectId: "finants-b0ec2",
            storageBucket: "finants-b0ec2.firebasestorage.app",
            messagingSenderId: "528722220942",
            appId: "1:528722220942:web:cc8459cc54c1365863b6df",
            measurementId: "G-GL046V7GE2"
        };
        // ---------------------------------------

        // Initialize only if config is replaced (simple check to avoid errors in console before setup)
        let db;
        let analytics;
        let trackingEnabled = false;



        // Initialize directly to ensure it runs
        try {
            const app = initializeApp(firebaseConfig);
            // Force Long Polling to bypass firewall/router blocks
            db = initializeFirestore(app, {
                experimentalForceLongPolling: true
            });
            analytics = getAnalytics(app);
            trackingEnabled = true;
            console.log("%c Firebase Initialized Successfully", "background: green; color: white; padding: 4px;");
        } catch (e) {
            console.error("%c Firebase Init Failed: " + e.message, "background: red; color: white; padding: 4px;");
        }

        // Expose helpers for app.js
        window.examAnalytics = {
            currentAttemptId: null,

            logStart: async function (mode = 'standard') {
                console.log("DEBUG: logStart called. Tracking enabled?", trackingEnabled);
                if (!trackingEnabled) {
                    console.warn("DEBUG: Tracking is DISABLED, aborting logStart.");
                    return;
                }
                try {
                    await addDoc(collection(db, "exam_attempts"), {
                        startedAt: serverTimestamp(),
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        status: 'started',
                        mode: mode,
                        lastQuestionIndex: 0
                    }).then(docRef => {
                        this.currentAttemptId = docRef.id;
                        console.log("%c EXAM STARTED: Data Sent to Firebase! ID: " + docRef.id, "background: green; color: white; padding: 4px; font-size: 14px;");
                    });

                    logEvent(analytics, 'exam_started', { mode: mode });

                } catch (e) {
                    console.error("%c EXAM START FAILED: " + e.message, "background: red; color: white; padding: 4px; font-size: 14px;");
                    // Check for permission denied specifically
                    if (e.message.includes("permission-denied")) {
                        console.error("%c CHECK FIRESTORE RULES!", "background: yellow; color: black; font-size: 20px; font-weight: bold;");
                    }
                }
            },

            logProgress: async function (currentIndex) {
                if (!trackingEnabled || !this.currentAttemptId) return;
                try {
                    const ref = doc(db, "exam_attempts", this.currentAttemptId);
                    await updateDoc(ref, {
                        lastQuestionIndex: currentIndex,
                        lastActiveAt: serverTimestamp()
                    });
                } catch (e) {
                    // Ignore errors for progress updates
                }
            },

            logEnd: async function (score, total, grade, durationDetails, incorrectQuestionIds) {
                if (!trackingEnabled || !this.currentAttemptId) return;
                try {

                    const ref = doc(db, "exam_attempts", this.currentAttemptId);
                    await updateDoc(ref, {
                        finishedAt: serverTimestamp(),
                        status: 'completed',
                        score: score,
                        maxScore: total,
                        grade: grade,
                        durationSeconds: durationDetails.seconds,
                        chapterStats: durationDetails.chapterStats || {},
                        incorrectQuestionIds: incorrectQuestionIds || []
                    });
                    logEvent(analytics, 'exam_completed', { score: score, grade: grade });

                } catch (e) {
                    console.error("Analytics Error (End):", e);

                }
            }
        };
    </script>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>

</html>
